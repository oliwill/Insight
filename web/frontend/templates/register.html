{% extends "base.html" %}
{% block title %}注册 · Insight{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-lg shadow p-6">
  <h1 class="text-xl font-bold mb-4">注册</h1>
  {% if error %}<div class="bg-red-50 text-red-700 text-sm rounded p-2 mb-3">{{ error }}</div>{% endif %}
  <form method="post" action="/auth/register" class="space-y-3">
    <div>
      <label class="block text-sm mb-1">邮箱</label>
      <input name="email" type="email" required autocomplete="email"
             class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm mb-1">密码（至少 8 位）</label>
      <input name="password" type="password" required autocomplete="new-password"
             class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm mb-1">确认密码</label>
      <input name="password2" type="password" required autocomplete="new-password"
             class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    {% if require_invite %}
    <div>
      <label class="block text-sm mb-1">邀请码</label>
      <input name="invite_code" type="text" required autocomplete="off"
             class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    {% endif %}
    <button class="w-full bg-blue-600 text-white rounded py-2 text-sm hover:bg-blue-700">注册</button>
  </form>
  <p class="text-sm text-gray-500 mt-4">已有账号？<a href="/auth/login" class="text-blue-600">登录</a></p>
</div>
{% endblock %}
