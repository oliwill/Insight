{% extends "base.html" %}
{% block title %}任务 · Insight{% endblock %}
{% block content %}
<h1 class="text-xl font-bold mb-4">分析任务</h1>
<p class="text-sm text-gray-500 mb-4">运行中的任务每 2 秒自动刷新。</p>
<table class="w-full bg-white rounded-lg shadow text-sm">
  <thead>
    <tr class="border-b text-left text-gray-500">
      <th class="p-3">ID</th>
      <th class="p-3">股票</th>
      <th class="p-3">状态</th>
      <th class="p-3">错误</th>
      <th class="p-3">创建时间</th>
    </tr>
  </thead>
  <tbody id="job-rows">
    {% for job in jobs %}
      {% include "partials/job_row.html" %}
    {% else %}
    <tr><td colspan="5" class="p-3 text-gray-400">暂无任务</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
