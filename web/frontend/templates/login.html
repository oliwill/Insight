{% extends "base.html" %}
{% block title %}登录 · Insight{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-lg shadow p-6">
  <h1 class="text-xl font-bold mb-1">登录</h1>
  <p class="text-sm text-gray-500 mb-4">Insight 股票分析平台</p>
  {% if error %}<div class="bg-red-50 text-red-700 text-sm rounded p-2 mb-3">{{ error }}</div>{% endif %}
  <form method="post" action="/auth/login" class="space-y-3">
    <div>
      <label class="block text-sm mb-1">邮箱</label>
      <input name="email" type="email" required autocomplete="email"
             class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm mb-1">密码</label>
      <input name="password" type="password" required autocomplete="current-password"
             class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <button class="w-full bg-blue-600 text-white rounded py-2 text-sm hover:bg-blue-700">登录</button>
  </form>
  <p class="text-sm text-gray-500 mt-4">没有账号？<a href="/auth/register" class="text-blue-600">注册</a></p>
</div>
{% endblock %}
